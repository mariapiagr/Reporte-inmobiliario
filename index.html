<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de reportes inmobiliarios</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#141a2b;--mut:#5b6478;--bd:#dfe3ee;--ac:#0b1f4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#181d2e;--tx:#e8ebf5;--mut:#9aa3ba;--bd:#2a3150;--ac:#7da2ff}}
:root[data-theme="dark"]{--bg:#0f1320;--card:#181d2e;--tx:#e8ebf5;--mut:#9aa3ba;--bd:#2a3150;--ac:#7da2ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:400px 1fr;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(max-width:1000px){.app{grid-template-columns:1fr}}
.form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;align-self:start}
h1{font:700 18px 'Space Grotesk',sans-serif;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 12px;font-size:13px}
fieldset{border:0;border-top:1px solid var(--bd);margin:12px 0 0;padding:10px 0 0}
legend{font:700 13px 'Space Grotesk',sans-serif;color:var(--ac);padding-right:8px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:64px;resize:vertical}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3 label{font-size:11px;margin-top:0}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:#d81e2c;color:#fff;font:700 15px Inter;cursor:pointer}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin-top:8px;font-weight:500;font-size:13px;padding:8px}
.pv{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:#e9ecf4;padding:12px}
/* Reporte (siempre claro) */
#rp{width:794px;margin:0 auto;background:#fff;color:#1c2233;font-family:Inter,sans-serif;line-height:1.4}
.hd{background:linear-gradient(115deg,#0a1a45 0%,#0d2670 55%,#1447c8 100%);color:#fff;padding:36px 38px 0;height:198px;border-right:5px solid #8c1a2a}
.hd small{display:block;color:#b9c6ea;font-weight:600;font-size:13px;margin-bottom:16px}
.logo{height:74px}.lg{height:74px;width:auto;display:block;margin-left:-6px}
.hd .nm{font-size:15px;margin-top:14px}
.bd{padding:26px 44px 10px}.intro{color:#5b6478;font-size:17px;margin:0 0 18px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.st div{background:#edf1fa;border-radius:12px;text-align:center;padding:18px 6px}
.st b{display:block;font:700 28px 'Space Grotesk',sans-serif;color:#0a1a45}.st span{font-size:12.5px;color:#5b6478}
.rp h2{font:700 17px 'Space Grotesk',sans-serif;color:#0a1a45;display:inline-block;border-bottom:3px solid #e2262f;padding-bottom:3px;margin:22px 0 12px}
.rp p{margin:0 0 8px;white-space:pre-wrap}.em{font-style:italic;color:#5b6478}
.lk{display:flex;gap:5px;padding:7px 0;border-bottom:1px solid #eceff6;font-size:13.5px;word-break:break-all}.lk a{color:#1a4fd6;text-decoration:none}
.ig{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.ig figure{margin:0;width:170px}.ig img{width:100%;border-radius:10px;display:block}
.ig figcaption{font-size:12px;color:#5b6478;margin-top:3px}.ig.c figure{width:172px}
ul.ac{list-style:none;padding:0;margin:0}.ac li{margin:0 0 6px;font-size:16.5px}.ac li:before{content:"● ";}
.nx{background:#0a1f4d;color:#fff;border-radius:14px;padding:20px 24px;margin:8px 0 24px}.nx b{display:block;font-size:15px;margin-bottom:3px}.nx p{color:#e6ebf8;font-size:14.5px;margin-bottom:12px}
.ft{display:flex;gap:14px;align-items:center;border-top:1px solid #eceff6;margin:0 44px;padding:22px 0 34px}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e2262f,#7c1420);color:#fff;font:700 18px Inter;display:flex;align-items:center;justify-content:center;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.ft b{font-size:17px}.ft div div{color:#5b6478;font-size:14px}
</style></head>
<body><div class="app">
<div class="form">
<h1>Reporte inmobiliario</h1><p class="sub">Completá los datos: la vista previa se actualiza sola y el PDF se descarga con un clic.</p>
<fieldset><legend>Encabezado</legend>
<div class="g2"><div><label>Fecha</label><input type="date" id="fecha"></div><div><label>Cliente (propietario)</label><input id="cliente"></div></div>
<div class="g2"><div><label>Asesor/a</label><input id="asesor"></div><div><label>Teléfono</label><input id="tel"></div></div>
<label>Email o cargo del asesor (opcional)</label><input id="extra"></fieldset>
<fieldset><legend>Métricas</legend><div class="g3" id="mets"></div></fieldset>
<fieldset><legend>Consultas y objeciones</legend>
<label>Consultas (vacío = "sin consultas")</label><textarea id="consultas"></textarea>
<label>Objeciones</label><textarea id="objeciones"></textarea></fieldset>
<fieldset><legend>Enlaces web</legend><label>Uno por línea: Portal | URL</label><textarea id="enlaces" style="min-height:110px"></textarea></fieldset>
<fieldset><legend>Publicidad</legend>
<label>Capturas de visualizaciones (varias)</label><input type="file" id="caps" accept="image/*" multiple>
<label>Flyers (varios)</label><input type="file" id="flys" accept="image/*" multiple>
<button class="s" id="clr" type="button">Quitar imágenes de publicidad</button></fieldset>
<fieldset><legend>Acciones y próximos pasos</legend>
<label>Acciones realizadas (una por línea)</label><textarea id="acciones" style="min-height:110px"></textarea>
<label>Análisis del precio</label><textarea id="precio"></textarea>
<label>Acciones para los próximos días</label><textarea id="prox"></textarea></fieldset>
<button id="dl" type="button">Descargar PDF</button>
<button class="s" id="pr" type="button">Alternativa: imprimir / guardar como PDF</button>
<button class="s" id="rst" type="button">Nuevo reporte (limpiar)</button>
</div>
<div class="pv"><div id="rp" class="rp"></div></div>
</div>

let img={caps:[],flys:[]};
$("mets").innerHTML=M.map((m,i)=>`<div><label>${m[0]}</label><input type="number" min="0" id="m${i}"></div>`).join("");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines=s=>s.split("\n").map(x=>x.trim()).filter(Boolean);
const fmt=d=>d?d.split("-").reverse().join("/"):"";
const ini=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
function render(){
 const v=k=>$(k).value, f=fmt(v("fecha")), first=(v("cliente").split(" ")[0]||"");
 const logo=`<img class="lg" src="${LOGO}" alt="RE/MAX">`;
 const links=lines(v("enlaces")).map(l=>{const i=l.search(/https?:/);if(i<0)return"";const n=l.slice(0,i).replace(/[\s|—–\-:]+$/,""),u=l.slice(i).trim();return`<div class="lk"><span>${esc(n)} —</span><a href="${esc(u)}">- ${esc(u)}</a></div>`}).join("");
 const mets=M.map((m,i)=>`<div><b>${v("m"+i)||0}</b><span>${m[0]}</span></div>`);
 const grp=(a,c,l,n)=>a.length?`<div class="ig ${c}">${a.map((s,i)=>`<figure><img src="${s}"><figcaption>${l}${n?" "+(i+1):""}</figcaption></figure>`).join("")}</div>`:"";
 $("rp").innerHTML=`<div class="hd"><small>Reporte inmobiliario · ${f}</small><div class="logo">${logo}</div><div class="nm">${esc(v("cliente"))}</div></div>
 <div class="bd"><p class="intro">Hola ${esc(first)}, acá va el movimiento que tuvo su propiedad durante este período.</p>
 <div class="st">${mets.slice(0,6).join("")}</div>
 <h2>Visitas y seguimiento</h2><div class="st">${mets.slice(6).join("")}</div>
 <h2>Consultas</h2>${v("consultas").trim()?`<p>${esc(v("consultas"))}</p>`:`<p class="em">No se registraron consultas nuevas en este período.</p>`}
 <h2>Objeciones</h2><p style="font-size:16px">${esc(v("objeciones"))}</p>
 ${links?`<h2>Enlaces web</h2>${links}`:""}
 ${img.caps.length||img.flys.length?`<h2>Publicidad</h2>${grp(img.caps,"c","Visualización Redes",0)}${grp(img.flys,"","Flyer",1)}`:""}
 <h2>Acciones realizadas</h2><ul class="ac">${lines(v("acciones")).map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
 <h2>Próximos pasos y conclusión</h2>
 <div class="nx"><b>Análisis del precio</b><p>${esc(v("precio"))}</p><b>Acciones para los próximos días</b><p style="margin:0">${esc(v("prox"))}</p></div></div>
 <div class="ft"><div class="av">${ini(v("asesor"))}</div><div><b>${esc(v("asesor"))} · ${f}</b><div>${esc(v("extra"))}</div><div>${esc(v("tel"))}</div></div></div>`;
 try{const o={};TX.forEach(k=>o[k]=v(k));M.forEach((_,i)=>o["m"+i]=v("m"+i));localStorage.setItem("rep",JSON.stringify(o))}catch(e){}
}
function load(o){TX.forEach(k=>$(k).value=o[k]??DEF[k]);M.forEach((m,i)=>$("m"+i).value=o["m"+i]??m[1])}
function rd(file){return new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(file)})}
async function up(id,k,multi){$(id).onchange=async e=>{const fs=[...e.target.files];const d=await Promise.all(fs.map(rd));img[k]=multi?d:(d[0]||"");render()}}
up("caps","caps",1);up("flys","flys",1);
$("clr").onclick=()=>{img.caps=[];img.flys=[];$("caps").value="";$("flys").value="";render()};
$("rst").onclick=()=>{if(!confirm("¿Limpiar todo el reporte?"))return;const o={...DEF};M.forEach((m,i)=>o["m"+i]=0);["cliente"].forEach(k=>o[k]="");load(o);img.caps=[];img.flys=[];render()};
document.querySelectorAll("input:not([type=file]),textarea").forEach(e=>e.addEventListener("input",render));
const W=794;
async function mk(){
 document.querySelectorAll(".pf").forEach(x=>x.remove());
 const f=document.createElement("iframe");f.className="pf";
 f.style.cssText="position:fixed;left:0;top:0;width:"+W+"px;height:1200px;border:0;opacity:0;pointer-events:none;z-index:-1";
 document.body.appendChild(f);
 const css=document.querySelector("style").textContent;
 const ready=new Promise(r=>{f.addEventListener("load",r,{once:true});setTimeout(r,5000)});
 const d=f.contentDocument;d.open();
 d.write('<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><style>'+css+'</style><style>html,body{margin:0;padding:0;background:#fff}#rp{margin:0!important;width:'+W+'px!important}</style></head><body>'+$("rp").outerHTML+'</body></html>');
 d.close();await ready;
 try{await d.fonts.ready}catch(e){}
 const el=d.getElementById("rp");
 await Promise.all([...el.querySelectorAll("img")].map(i=>i.decode?i.decode().catch(()=>{}):0));
 const h=Math.ceil(el.getBoundingClientRect().height);
 f.style.height=h+"px";
 return{f,d,el,h};
}
$("dl").onclick=async()=>{
 const b=$("dl");b.textContent="Generando…";let F;
 const nm=("reporte-"+($("cliente").value||"cliente")+"-"+$("fecha").value).replace(/\s+/g,"-").toLowerCase()+".pdf";
 try{
  F=await mk();
  const cv=await html2canvas(F.el,{scale:2,useCORS:true,backgroundColor:"#ffffff",width:W,height:F.h,windowWidth:W,windowHeight:F.h,scrollX:0,scrollY:0});
  const h=Math.round(cv.height/2);
  const pdf=new window.jspdf.jsPDF({unit:"px",format:[W,h],orientation:"portrait",hotfixes:["px_scaling"],compress:true});
  pdf.addImage(cv.toDataURL("image/jpeg",.95),"JPEG",0,0,W,h);
  pdf.save(nm);
 }catch(e){if(!e||e.code!=="declined")alert("No se pudo generar el PDF: "+((e&&e.message)||e))}
 finally{if(F)F.f.remove();b.textContent="Descargar PDF"}};
$("pr").onclick=async()=>{
 const F=await mk(),s=F.d.createElement("style");
 s.textContent="@page{size:"+W+"px "+F.h+"px;margin:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}";
 F.d.head.appendChild(s);F.f.contentWindow.onafterprint=()=>F.f.remove();F.f.contentWindow.focus();F.f.contentWindow.print()};
let saved=null;try{saved=JSON.parse(localStorage.getItem("rep"))}catch(e){}
load(saved||DEF);render();
</script></body></html>
